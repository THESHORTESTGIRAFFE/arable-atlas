{% extends 'layout.html' %}
{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 960px;">
    <div class="text-center mb-4">
      <h1 class="display-5 fw-bold" data-i18n="assistant_title">Meet Plotty 🌱</h1>
      <p class="text-muted" data-i18n="assistant_subtitle">Your farming companion, in your language</p>
    </div>
    <div class="glass-panel p-3 mb-3 bg-white">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <p id="fieldContext" class="small mb-0" data-i18n="no_context">No field selected. Analyze a field to give Plotty soil and forecast context.</p>
        <div class="d-flex flex-wrap gap-2"><a href="{{ url_for('home') }}" class="btn btn-sm btn-outline-primary rounded-pill" data-i18n="analyze">Analyze</a><button id="clearContext" class="btn btn-sm btn-light rounded-pill" data-i18n="remove_context">Clear field context</button></div>
      </div>
    </div>
    <div class="glass-panel bg-white chat-shell">
      <div class="p-3 border-bottom d-flex flex-wrap justify-content-between gap-2 align-items-center">
        <strong>🌱 Plotty</strong>
        <button id="clearChat" class="btn btn-sm btn-outline-secondary rounded-pill" data-i18n="clear_chat">New conversation</button>
      </div>
      <div id="chatBody" class="chat-body p-3 p-md-4" role="log" aria-live="polite" aria-label="Plotty conversation"></div>
      <div id="chatStatus" class="px-3 small text-muted" role="status" aria-live="polite"></div>
      <div id="suggestedQuestions" class="d-flex flex-wrap gap-2 px-3 py-2"></div>
      <form id="chatForm" class="p-3 border-top">
        <label for="chatInput" class="visually-hidden" data-i18n="chat_placeholder">Ask Plotty about your field…</label>
        <div class="d-flex gap-2 align-items-end">
          <textarea id="chatInput" rows="2" maxlength="4000" class="form-control" data-i18n-placeholder="chat_placeholder" placeholder="Ask Plotty about your field…"></textarea>
          <button type="button" id="voiceBtn" class="btn btn-light" data-i18n-title="voice" aria-label="Voice input"><i class="bx bx-microphone fs-4"></i></button>
          <button id="sendChat" class="btn btn-primary rounded-pill" data-i18n-title="send" aria-label="Send message"><i class="bx bx-send fs-4"></i></button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
